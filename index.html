<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <p id="new-record-msg" class="new-record-msg"></p>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" />
            <button id="save-score-btn" class="secondary-btn">Guardar</button>
          </div>
        </div>

        <div id="records" class="records">
          <span class="label">RÉCORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>NOMBRE</th><th>PUNTOS</th><th>LÍNEAS</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="records-stats">
            <div><span class="label">MEJOR COMBO</span><span class="stat-value" id="best-combo">0</span></div>
            <div><span class="label">MÁX. LÍNEAS</span><span class="stat-value" id="max-lines">0</span></div>
          </div>
        </div>

        <button id="restart-btn">Jugar</button>
        <p id="start-hint" class="start-hint">o pulsa <kbd>Enter</kbd></p>
        <button id="reset-records-btn" class="link-btn">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
