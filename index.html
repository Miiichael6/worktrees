<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> menú</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">PAUSA</p>
        <p id="overlay-score"></p>

        <div id="menu-main" class="menu">
          <button type="button" class="menu-item" id="resume-btn" data-action="resume">Reanudar</button>
          <button type="button" class="menu-item" id="restart-btn" data-action="restart">Reiniciar</button>
          <button type="button" class="menu-item" data-action="controls">Ver controles</button>
          <div class="menu-item level-select" data-item="level">
            <span class="level-select-label">Nivel inicial</span>
            <span class="level-select-control">
              <button type="button" class="level-arrow" data-action="level-dec" aria-label="Bajar nivel inicial">&#9664;</button>
              <span id="start-level-value" class="level-select-value">1</span>
              <button type="button" class="level-arrow" data-action="level-inc" aria-label="Subir nivel inicial">&#9654;</button>
            </span>
          </div>
          <p class="menu-note">Se aplica en la próxima partida</p>
        </div>

        <div id="menu-controls" class="menu hidden">
          <span class="label">CONTROLES</span>
          <ul class="menu-controls-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> menú / pausa</li>
          </ul>
          <button type="button" class="menu-item" data-action="back">Volver</button>
        </div>

        <p class="menu-hint"><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> elegir · <kbd>←</kbd><kbd>→</kbd> nivel</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
